name: Android debug validation

on:
  pull_request:
    paths:
      - 'android/**'
      - 'capacitor.config.json'
      - 'icons/**'
      - 'scripts/**'
      - 'src/**'
      - 'styles/**'
      - 'index.html'
      - 'manifest.json'
      - 'sw.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android-debug.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Install dependencies
        run: npm ci
      - name: Build and sync Android shell
        run: npm run android:sync
      - name: Assemble debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - name: Record SHA-256 checksum
        working-directory: android/app/build/outputs/apk/debug
        run: sha256sum *.apk > SHA256SUMS.txt
      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: loughdin-debug-apk
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error

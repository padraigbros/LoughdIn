name: Continuous integration

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-and-database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: loughdin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d loughdin_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Syntax check
        run: npm run check
      - name: Build
        run: npm run build
      - name: JavaScript tests
        run: npm test
      - name: PostgreSQL migration contract
        env:
          PGPASSWORD: postgres
          TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/loughdin_test
        run: psql "$TEST_DATABASE_URL" -f tests/server/sync_foundation.sql
